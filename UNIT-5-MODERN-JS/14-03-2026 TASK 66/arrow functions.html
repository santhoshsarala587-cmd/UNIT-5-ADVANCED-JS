<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Arrow Functions</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#eef4ff;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:600px;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        h2{
            margin-bottom:20px;
        }

        button{
            padding:12px 20px;
            border:none;
            border-radius:6px;
            background:#2563eb;
            color:white;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        #result{
            margin-top:25px;
            line-height:1.8;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>Arrow Function Demonstration</h2>

        <p>
            Click the button to calculate
            average and highest mark using
            Arrow Functions.
        </p>

        <br>

        <button id="generateReport">
            Generate Report
        </button>

        <div id="result"></div>

    </div>

    <script src="arrow functions.js"></script>

</body>

</html>
